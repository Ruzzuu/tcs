<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Secure Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            @apply bg-background-light dark:bg-background-dark font-display text-[#111318] dark:text-white;
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center p-6">
<div class="w-full max-w-[400px] flex flex-col items-center">
<div class="mb-10 flex flex-col items-center">
<div class="size-20 bg-primary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20 mb-4">
<span class="material-symbols-outlined text-white text-4xl">dry_cleaning</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-center">Admin Portal</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Specialized Cleaning Services</p>
</div>
<div class="w-full bg-surface-light dark:bg-surface-dark p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800">
<form class="space-y-6" onsubmit="event.preventDefault();">
<div>
<label class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300">
                        Email or Username
                    </label>
<div class="relative">
<input class="w-full h-12 rounded-xl bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 focus:border-primary focus:ring-primary/20 transition-all px-4 text-base" placeholder="admin@gmail.com" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300">
                        Password
                    </label>
<div class="relative">
<input class="w-full h-12 rounded-xl bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 focus:border-primary focus:ring-primary/20 transition-all px-4 pr-12 text-base" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<div class="mt-3 flex justify-end">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full h-14 bg-primary hover:bg-blue-700 text-white font-bold text-lg rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Login
                </button>
</form>
</div>
<div class="mt-8 text-center px-4">
<div class="flex items-center justify-center gap-2 text-gray-400 dark:text-gray-500 mb-1">
<span class="material-symbols-outlined text-sm">lock</span>
<p class="text-xs uppercase tracking-widest font-bold">Authorized Access Only</p>
</div>
<p class="text-sm text-gray-500 dark:text-gray-400">
                Contact your developer for an account.
            </p>
</div>
</div>

</body></html>
