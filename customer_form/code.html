<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customer Service Request Form</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2230",
                        "text-main": "#111318",
                        "text-sub": "#616f89",
                        "border-light": "#dbdfe6",
                        "border-dark": "#2a3441",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<div class="sticky top-0 z-50 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-md border-b border-border-light dark:border-border-dark px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-2xl">local_laundry_service</span>
</div>
</div>
<h1 class="text-text-main dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">
            Form Cuci Barang
        </h1>
<div class="w-2"></div> 
</div>
<main class="flex-1 w-full max-w-md mx-auto px-4 py-6 pb-24">
<div class="mb-8 text-center">
<h2 class="text-text-main dark:text-white text-2xl font-bold mb-2">Layanan Cuci Premium</h2>
<p class="text-text-sub dark:text-gray-400 text-sm">Isi data di bawah ini untuk layanan penjemputan gratis ke lokasi Anda.</p>
</div>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-2">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Nama Lengkap <span class="text-red-500">*</span></label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main dark:text-white placeholder:text-text-sub dark:placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" placeholder="Masukkan nama lengkap anda" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Nomor WhatsApp <span class="text-red-500">*</span></label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main dark:text-white placeholder:text-text-sub dark:placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" placeholder="0812xxxx..." type="tel"/>
<div class="absolute right-4 text-text-sub dark:text-gray-500 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">call</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Alamat Penjemputan <span class="text-text-sub font-normal text-xs ml-1">(Opsional)</span></label>
<div class="relative">
<textarea class="w-full min-h-[100px] p-4 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main dark:text-white placeholder:text-text-sub dark:placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all resize-none" placeholder="Jalan Mawar No. 10, Jakarta Selatan..."></textarea>
<div class="absolute right-4 top-4 text-text-sub dark:text-gray-500 pointer-events-none">
<span class="material-symbols-outlined text-xl">location_on</span>
</div>
</div>
</div>
<div class="h-px bg-border-light dark:bg-border-dark w-full my-2"></div>
<div class="flex flex-col gap-4">
<div class="p-5 rounded-2xl bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark shadow-sm relative overflow-hidden">
<div class="flex items-center gap-2 mb-4 pb-3 border-b border-border-light dark:border-border-dark">
<div class="bg-primary/10 text-primary p-1.5 rounded-lg">
<span class="material-symbols-outlined text-lg">laundry</span>
</div>
<h3 class="font-bold text-text-main dark:text-white text-sm uppercase tracking-wide">Detail Item 1</h3>
</div>
<div class="flex flex-col gap-2 mb-4">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Jenis Barang</label>
<div class="relative">
<select class="w-full h-12 pl-4 pr-10 appearance-none rounded-xl border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all cursor-pointer">
<option disabled="" selected="" value="">Pilih layanan...</option>
<option value="sepatu">Cuci Sepatu (Deep Clean)</option>
<option value="tas">Cuci Tas (All Material)</option>
<option value="helm">Cuci Helm (Deep Clean)</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-text-sub dark:text-gray-500 pointer-events-none flex items-center">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2 mb-4">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Jumlah Barang</label>
<div class="flex items-center justify-between border border-border-light dark:border-border-dark rounded-xl p-1 bg-background-light dark:bg-background-dark h-12">
<button class="size-10 rounded-lg flex items-center justify-center text-text-sub hover:text-text-main hover:bg-white dark:hover:bg-surface-dark hover:shadow-sm transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-xl">remove</span>
</button>
<span class="font-bold text-lg text-text-main dark:text-white min-w-[32px] text-center">1</span>
<button class="size-10 rounded-lg flex items-center justify-center text-primary hover:text-white bg-white dark:bg-surface-dark shadow-sm hover:bg-primary transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-xl">add</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-text-main dark:text-gray-200 text-sm font-medium">Catatan Tambahan <span class="text-text-sub font-normal text-xs ml-1">(Opsional)</span></label>
<textarea class="w-full min-h-[80px] p-3 rounded-xl border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-white placeholder:text-text-sub dark:placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all resize-none text-sm" placeholder="Contoh: Noda tinta di bagian samping, tali sepatu diganti, dll..."></textarea>
</div>
</div>
<button class="w-full py-3.5 rounded-xl border border-dashed border-primary/40 bg-primary/5 hover:bg-primary/10 text-primary font-semibold text-sm flex items-center justify-center gap-2 transition-all active:scale-[0.98] group" type="button">
<div class="p-0.5 rounded-full border border-primary/40 flex items-center justify-center group-hover:border-primary transition-colors">
<span class="material-symbols-outlined text-base">add</span>
</div>
<span>Tambah Barang Lain</span>
</button>
</div>
<div class="mt-4 p-5 rounded-2xl bg-primary/5 dark:bg-primary/20 border border-primary/20 flex flex-col items-center justify-center gap-1 text-center shadow-sm">
<span class="text-text-sub dark:text-gray-300 text-sm font-medium uppercase tracking-wide">Estimasi Total Biaya</span>
<span class="text-primary dark:text-blue-400 text-3xl font-extrabold tracking-tight">Rp 75.000</span>
<p class="text-xs text-text-sub dark:text-gray-400 mt-1">*Harga final dikonfirmasi saat penjemputan</p>
</div>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-lg border-t border-border-light dark:border-border-dark p-4 z-40">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-14 bg-primary hover:bg-blue-700 active:scale-[0.98] text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/25 transition-all flex items-center justify-center gap-2 group">
<span>Kirim Data</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>

</body></html>
