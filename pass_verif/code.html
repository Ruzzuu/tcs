<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Password Recovery - Cleaning Service</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f9fafb",
                        "background-dark": "#1a202d",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .ios-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<!-- Top Navigation / App Bar -->
<div class="flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="text-[#111318] dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</div>
</div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col px-6 pt-4 pb-12 max-w-md mx-auto w-full">
<!-- Header Image / Logo -->
<div class="flex justify-center mb-10 pt-4">
<div class="w-20 h-20 bg-primary/10 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1">cleaning_services</span>
</div>
</div>
<!-- Headline -->
<div class="mb-4">
<h2 class="text-[#111318] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">
                Lupa Kata Sandi?
            </h2>
</div>
<!-- Body Text -->
<div class="mb-10">
<p class="text-[#616f89] dark:text-slate-400 text-base font-normal leading-relaxed text-center px-2">
                Masukkan email terdaftar Anda untuk menerima verifikasi pengaturan ulang kata sandi.
            </p>
</div>
<!-- Form Section -->
<div class="space-y-6">
<div class="flex flex-col gap-1.5">
<label class="text-[#111318] dark:text-white text-sm font-semibold ml-1">Email Admin</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#616f89]">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="form-input flex w-full rounded-xl text-[#111318] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbdfe6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-[#616f89] pl-12 pr-4 text-base font-normal transition-all duration-200 ios-shadow" placeholder="admin@cleaningservice.com" type="email" value=""/>
</div>
</div>
<!-- Primary CTA Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl text-base transition-colors duration-200 shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Kirim Verifikasi</span>
<span class="material-symbols-outlined text-xl">send</span>
</button>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Footer Link -->
<div class="mt-auto pt-8">
<a class="flex items-center justify-center gap-2 text-primary font-semibold text-base hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-lg">login</span>
<span>Kembali ke Login</span>
</a>
</div>
</main>
<!-- Visual Decoration (Abstract) -->
<div class="fixed -z-10 bottom-0 left-0 w-full opacity-5 pointer-events-none overflow-hidden">
<div class="w-[500px] h-[500px] bg-primary rounded-full blur-[100px] -mb-64 -ml-32"></div>
</div>
</body></html>
